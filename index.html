<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Barato - Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-white text-gray-800 font-sans antialiased">

    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-gray-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-2 cursor-pointer" onclick="filtrarCategoria('todos')">
                <div class="bg-blue-600 text-white p-2.5 rounded-xl shadow-md">
                    <i class="fa-solid fa-tags text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-tight text-gray-900">Compra<span class="text-blue-600">Barato</span></h1>
                    <p class="text-xs text-gray-400 font-medium">Curaduría de ofertas y enlaces</p>
                </div>
            </div>
            <div class="w-full md:w-96 relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="buscador" onkeyup="buscarProductos()" placeholder="Buscar electrodomésticos, celulares, hogar..." class="w-full pl-10 pr-4 py-2.5 bg-gray-50 border border-gray-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
            </div>
        </div>
        <div class="bg-gray-50 border-t border-gray-100 py-2.5">
            <div class="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto no-scrollbar">
                <button onclick="filtrarCategoria('todos')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-blue-600 text-white shadow-sm transition whitespace-nowrap">🌟 Todos</button>
                <button onclick="filtrarCategoria('electrodomesticos')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition whitespace-nowrap">⚡ Electrodomésticos</button>
                <button onclick="filtrarCategoria('indumentaria')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition whitespace-nowrap">👕 Indumentaria</button>
                <button onclick="filtrarCategoria('hogar')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition whitespace-nowrap">🏠 Hogar</button>
                <button onclick="filtrarCategoria('celulares')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition whitespace-nowrap">📱 Celulares</button>
                <button onclick="filtrarCategoria('gamer')" class="cat-btn px-4 py-1.5 rounded-full text-xs font-semibold bg-white text-gray-600 border border-gray-200 hover:bg-gray-100 transition whitespace-nowrap">🎮 Gamer</button>
            </div>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-4 mt-6">
        <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl flex items-center gap-3 text-blue-900 text-xs md:text-sm">
            <i class="fa-solid fa-circle-info text-blue-600 text-lg shrink-0"></i>
            <p><strong>Aviso:</strong> Solo compartimos enlaces a tiendas oficiales.</p>
        </div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="contenedor-productos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <footer class="bg-gray-50 border-t border-gray-200 mt-16 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 text-xs">
            <p>&copy; 2026 Compra Barato</p>
        </div>
    </footer>

    <script>
        // ========== PRODUCTOS CON RUTAS RELATIVAS ==========
        const productos = [
            {
                id: 1,
                nombre: "Buclera Rizador de Pelo Suono Iónica",
                categoria: "electrodomesticos",
                imagen: "img/buclera.jpg", // Ruta relativa
                tienda: "Ver en Mercado Libre",
                link: "https://www.mercadolibre.com.ar/buclera-rizador-de-pelo-suono-calentamiento-rapido-ionica-color-negro/p/MLA48265953"
            },
            {
                id: 2,
                nombre: "Samsung Galaxy A07 64GB Negro",
                categoria: "celulares",
                imagen: "img/samsung galaxy a07.jpg", // Ruta relativa (con espacios)
                tienda: "Ver en Mercado Libre",
                link: "https://www.mercadolibre.com.ar/samsung-galaxy-a07-64gb-negro/p/MLA63437715"
            },
            {
                id: 3,
                nombre: "Combo Sábanas 1 1/2 Plz + Toallas",
                categoria: "hogar",
                imagen: "https://picsum.photos/seed/sabanas/400/300",
                tienda: "Ver en Mercado Libre",
                link: "https://articulo.mercadolibre.com.ar/MLA-1237189473-combo-1-juego-sabanas-tango-1-12-plz-1-juego-toallas-_JM"
            },
            {
                id: 4,
                nombre: "Juego Sábanas Smart Home Twin 1 1/2 Plz",
                categoria: "hogar",
                imagen: "https://picsum.photos/seed/sabanas2/400/300",
                tienda: "Ver en Mercado Libre",
                link: "https://articulo.mercadolibre.com.ar/MLA-1269147599-juego-sabanas-smart-home-twin-1-12-plaza-3-piezas-_JM"
            },
            {
                id: 5,
                nombre: "Teclado Mecánico Gamer RGB",
                categoria: "gamer",
                imagen: "https://picsum.photos/seed/teclado/400/300",
                tienda: "Ver en Mercado Libre",
                link: "https://www.mercadolibre.com.ar/teclado-mecanico-gamer-rgb-retroiluminado/p/MLA18942836"
            },
            {
                id: 6,
                nombre: "Campera Rompevientos Deportiva",
                categoria: "indumentaria",
                imagen: "https://picsum.photos/seed/campera/400/300",
                tienda: "Ver en Mercado Libre",
                link: "https://www.mercadolibre.com.ar/campera-rompevientos-deportiva-unisex/p/MLA1234567890"
            }
        ];

        // ========== FUNCIONES ==========
        function mostrarProductos(lista) {
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = '';
            if (lista.length === 0) {
                contenedor.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No se encontraron productos.</div>`;
                return;
            }
            lista.forEach(p => {
                contenedor.innerHTML += `
                    <div class="bg-white border border-gray-100 rounded-2xl shadow-sm hover:shadow-md transition flex flex-col overflow-hidden group">
                        <div class="relative bg-gray-50 h-52 overflow-hidden flex items-center justify-center p-4">
                            <span class="absolute top-3 left-3 bg-white/90 backdrop-blur text-xs font-semibold px-2.5 py-1 rounded-full shadow-xs text-gray-700 capitalize">${p.categoria}</span>
                            <img src="${p.imagen}" alt="${p.nombre}" class="object-contain h-full w-full group-hover:scale-105 transition duration-300" onerror="this.src='https://picsum.photos/seed/error/400/300'">
                        </div>
                        <div class="p-5 flex flex-col flex-grow justify-between">
                            <h3 class="font-bold text-gray-900 text-base mb-4 line-clamp-3">${p.nombre}</h3>
                            <a href="${p.link}" target="_blank" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-center font-bold py-3 px-4 rounded-xl shadow-sm transition text-sm flex items-center justify-center gap-2">
                                <span>${p.tienda}</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarCategoria(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-blue-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200');
            });
            if (event && event.target) {
                event.target.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200');
                event.target.classList.add('bg-blue-600', 'text-white', 'shadow-sm');
            }

            if (cat === 'todos') {
                mostrarProductos(productos);
            } else {
                const filtrados = productos.filter(p => p.categoria === cat);
                mostrarProductos(filtrados);
            }
        }

        function buscarProductos() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = productos.filter(p =>
                p.nombre.toLowerCase().includes(texto) ||
                p.categoria.toLowerCase().includes(texto)
            );
            mostrarProductos(filtrados);
        }

        // ========== INICIAR ==========
        mostrarProductos(productos);
    </script>
</body>
</html>
